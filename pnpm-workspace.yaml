packages:
  - apps/*
  - packages/*

# One place for every shared dependency version. Packages reference these as `catalog:`.
catalog:
  '@fontsource-variable/inter': ^5.3.0 # the interface typeface, bundled so the app needs no font CDN
  '@fontsource-variable/jetbrains-mono': ^5.3.0 # ids, hashes and amounts in a fixed-width face
  '@tanstack/react-query': ^5.104.0 # server state in the web app: caching, refetching, mutations
  '@testing-library/jest-dom': ^7.0.0
  '@testing-library/react': ^16.3.0
  '@testing-library/user-event': ^14.6.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.0
  jsdom: ^30.1.0 # a DOM for component tests
  react: ^19.3.0
  react-dom: ^19.3.0
  react-router-dom: ^7.18.0 # routes for the landing page and the dashboard
  vite: ^8.3.0 # dev server and bundler for the web app
  clsx: ^2.1.1
  framer-motion: ^12.4.0
  lucide-react: ^1.52.0
  '@biomejs/biome': ^2.5.0
  '@modelcontextprotocol/sdk': ^1.32.1
  '@types/node': ^24.0.0 # matches the oldest supported runtime (Node 24 LTS)
  '@types/pg': ^8.23.1
  '@vitest/coverage-v8': ^5.0.0
  ajv: ^8.20.0 # validates the exported JSON Schemas against real documents in @bursar/schemas tests
  ajv-formats: ^3.0.1 # the date-time and uri formats those schemas use
  drizzle-kit: ^0.31.11 # generates the SQL migrations for @bursar/db from its schema
  drizzle-orm: ^0.45.3 # typed queries over Postgres (PayPal docs and the plan both assume Postgres)
  '@electric-sql/pglite': ^0.5.8 # real Postgres in WASM, so database tests need no Docker
  fast-check: ^4.10.0
  hono: ^4.13.0 # the HTTP framework for the API: small, typed and runs on Node and the edge
  '@hono/node-server': ^2.1.0 # serves the Hono app on Node
  pino: ^10.4.0 # structured logging with built-in redaction
  lefthook: ^2.1.0
  pg: ^8.23.1 # the node-postgres driver the API and workers connect with
  tsx: ^4.23.0
  typescript: ^7.0.0
  vitest: ^5.0.0
  zod: ^4.6.0 # runtime validation and JSON Schema for @bursar/schemas

# Supply-chain hygiene: lifecycle scripts are denied unless a package is listed here.
allowBuilds:
  esbuild: true
  lefthook: true

# Refuse to install on a Node version outside `engines`.
engineStrict: true

minimumReleaseAgeExclude:
  - '@modelcontextprotocol/sdk@1.32.1'
